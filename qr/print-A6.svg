<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 105 148">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#D4A24C"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#D4A24C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4A24C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="105" height="148" fill="url(#bg)"/>
  <rect width="105" height="148" fill="url(#topGlow)"/>

  <!-- золотая рамка -->
  <rect x="3" y="3" width="99" height="142" fill="none" stroke="#D4A24C" stroke-width="0.4" opacity="0.55"/>

  <!-- TIMER BAR -->
  <text x="52.5" y="18" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="9" fill="url(#goldText)" letter-spacing="1">TIMER BAR</text>
  <text x="52.5" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#9A9388" letter-spacing="2.5">ЛАУНДЖ-БАР · АНАПА</text>

  <!-- заголовок -->
  <text x="52.5" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="#F5F1E8">Отзывы и предложения</text>
  <line x1="40.5" y1="35" x2="64.5" y2="35" stroke="#D4A24C" stroke-width="0.4"/>

  <!-- белая подложка под QR -->
  <rect x="20.9" y="42.4" width="63.2" height="63.2" rx="1.5" fill="#F5F1E8"/>

  <!-- реальный QR -->
  <g transform="translate(22.9,44.4) scale(1.4439024390243904)">
    <path d="qr-path" fill="#0A0A0A"/>
  </g>

  <!-- подпись -->
  <text x="52.5" y="111.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#D4A24C" letter-spacing="1.5">СКАНИРУЙТЕ КАМЕРОЙ ТЕЛЕФОНА</text>

  <!-- подвал -->
  <text x="52.5" y="141" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#9A9388">ул. Промышленная, 3 · Анапа</text>
  <text x="52.5" y="144.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="2.2" fill="#5C564F">Ежедневно 11:00–02:00 · +7 918 499-01-01</text>
</svg>